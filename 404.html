<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
        var urlParams = new URLSearchParams(window.location.search);
        var code = urlParams.get('code');
        window.location.replace(window.location.protocol + '//' + window.location.hostname + (window.location.port ? ':' + window.location.port : '') + '/?code=' + code);
    </script>
</head>
<body>
</body>
</html>
