<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASAJ 2025/2026 - SMK Negeri 1 Kismantoro</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
        .card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-width: 400px; width: 90%; border-top: 5px solid #d32f2f; }
        .btn { display: inline-block; background: #1a237e; color: white; padding: 12px 24px; text-decoration: none; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; border: none; margin-top: 10px; }
        .status { color: #d32f2f; font-weight: bold; margin: 15px 0; }
    </style>
</head>
<body>
    <div id="app" class="card">
        <h2>Memproses...</h2>
        <p>Mohon tunggu sebentar.</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const ua = navigator.userAgent;
        const isIphone = /iPhone|iPad|iPod/.test(ua);
        const isSEB = ua.includes('SEB');

        // 1. Logika Deteksi Minimize (Putus Koneksi)
        document.addEventListener("visibilitychange", function() {
            if (document.hidden) {
                // Hapus sesi izin dan paksa refresh saat ditinggalkan
                sessionStorage.removeItem("isVerified");
                window.location.href = window.location.pathname; // Kembali ke halaman bersih tanpa kode
            }
        });

        // 2. Cek Izin Akses
        if (isIphone && !isSEB) {
            const sebLink = window.location.href.replace("https://", "seb://");
            document.getElementById('app').innerHTML = `
                <h2>Gunakan SEB</h2>
                <p>Klik tombol untuk mengunci iPhone ke mode ujian.</p>
                <a href="${sebLink}" class="btn">BUKA DI SEB</a>
            `;
        } else {
            const allowed = ['Exambro', 'CBT', 'Kiosk', 'Version/4.0', 'wv', 'SEB'];
            let isValid = allowed.some(k => ua.toLowerCase().includes(k.toLowerCase()));
            
            if (ua.includes('Windows') || ua.includes('Macintosh')) { isValid = false; }

            // Jika valid dan ada kode, berikan izin sesi
            if (isValid && code) {
                sessionStorage.setItem("isVerified", "true");
                try {
                    const targetUrl = atob(code);
                    window.location.replace(targetUrl);
                } catch (e) {
                    document.getElementById('app').innerHTML = "<h2>Error</h2><p>Link tidak valid.</p>";
                }
            } else {
                // Tampilan jika koneksi terputus/habis (Siswa harus scan ulang)
                document.getElementById('app').innerHTML = `
                    <h2>ASAJ 2025/2026</h2>
                    <strong>SMK Negeri 1 Kismantoro</strong>
                    <div class="status">KONEKSI TERPUTUS</div>
                    <p>Sesi ujian berakhir karena Anda meninggalkan aplikasi.</p>
                    <p>Silakan <b>Scan QR Soal</b> kembali untuk melanjutkan.</p>
                    <div style="font-size:0.7rem; color:#999; margin-top:20px;">ID: ${ua}</div>
                `;
            }
        }
    </script>
</body>
</html>
