<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASAJ 2025/2026 - SMK Negeri 1 Kismantoro</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
        .card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-width: 400px; width: 90%; border-top: 5px solid #d32f2f; }
        .alert { background: #ffebee; color: #c62828; padding: 15px; border-radius: 8px; margin: 20px 0; font-weight: bold; }
        .btn { display: inline-block; background: #1a237e; color: white; padding: 12px 24px; text-decoration: none; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; border: none; }
        .ua-box { background: #eee; font-size: 0.8rem; padding: 10px; border-radius: 5px; word-break: break-all; margin-top: 20px; text-align: left; }
    </style>
</head>
<body>
    <div id="app" class="card">
        <h2>Memproses...</h2>
        <p>Mohon tunggu sebentar.</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const ua = navigator.userAgent;
        const isIphone = /iPhone|iPad|iPod/.test(ua);
        const isSEB = ua.includes('SEB');

        // 1. CEK JAM OPERASIONAL (07:00 - 15:00)
        const now = new Date();
        const hour = now.getHours();
        // if (hour < 7 || hour >= 15) { 
        //    document.getElementById('app').innerHTML = "<h2>Akses Ditutup</h2><p>Ujian pukul 07:00-15:00.</p>";
        // } else { ... }

        // 2. LOGIKA PROTEKSI IPHONE (CEK SEB)
        if (isIphone && !isSEB) {
            const sebLink = window.location.href.replace("https://", "seb://");
            document.getElementById('app').innerHTML = `
                <h2>Gunakan SEB</h2>
                <p>Klik tombol di bawah untuk mengunci iPhone ke mode ujian.</p>
                <a href="${sebLink}" class="btn">BUKA DI SEB</a>
            `;
        } else {
            // 3. FILTER USER-AGENT KETAT (Hanya Exambro / SEB)
            const allowed = ['Exambro', 'CBT', 'Kiosk', 'Version/4.0', 'wv', 'SEB'];
            let isValid = allowed.some(k => ua.toLowerCase().includes(k.toLowerCase()));
            
            // Blokir Windows/Mac
            if (ua.includes('Windows') || ua.includes('Macintosh')) { isValid = false; }

            if (isValid && code) {
                try {
                    const targetUrl = atob(code);
                    window.location.replace(targetUrl);
                } catch (e) {
                    document.getElementById('app').innerHTML = "<h2>Error</h2><p>Link salah.</p>";
                }
            } else {
                // 4. TAMPILAN BLOKIR (Mencegah Akses Browser Biasa/Minimize)
                document.getElementById('app').innerHTML = `
                    <h2>ASAJ 2025/2026</h2>
                    <div class="alert">AKSES DITOLAK!</div>
                    <p>Wajib menggunakan <b>Exambro</b> (Android) atau <b>Safe Exam Browser</b> (iOS).</p>
                    <button onclick="location.reload()" class="btn">COBA LAGI</button>
                    <div class="ua-box"><b>ID Perangkat:</b><br>${ua}</div>
                `;
            }
        }
    </script>
</body>
</html>
