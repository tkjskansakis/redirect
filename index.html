<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASAJ 2025/2026 - SMK Negeri 1 Kismantoro</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center; }
        .card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-width: 400px; width: 90%; border-top: 5px solid #d32f2f; }
        h2 { color: #1a237e; font-size: 1.3rem; margin-bottom: 5px; }
        .alert { background: #ffebee; color: #c62828; padding: 15px; border-radius: 8px; margin: 20px 0; font-weight: bold; border: 1px solid #ffcdd2; }
        .btn { display: inline-block; background: #1a237e; color: white; padding: 12px 24px; text-decoration: none; border-radius: 6px; font-weight: bold; cursor: pointer; border: none; width: 100%; margin-bottom: 10px; }
        .btn-copy { background: #454545; font-size: 0.8rem; }
        .ua-box { background: #eee; font-size: 0.85rem; padding: 15px; border-radius: 8px; word-break: break-all; color: #333; margin-top: 20px; text-align: left; border: 1px solid #ddd; }
        .ua-title { font-weight: bold; font-size: 0.7rem; color: #777; margin-bottom: 5px; display: block; }
    </style>
</head>
<body>
    <div id="app" class="card">
        <h2>Memproses...</h2>
        <p>Mohon tunggu sebentar.</p>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const ua = navigator.userAgent;
        
        // --- PENGATURAN WAKTU ---
        const now = new Date();
        const hour = now.getHours();
        let isTimeValid = true; 

        // Untuk aktifkan pembatasan jam (07:00-15:00), hapus tanda // di bawah:
        // if (hour < 7 || hour >= 15) { isTimeValid = false; }

        if (!isTimeValid) {
            document.getElementById('app').innerHTML = `
                <h2>Akses Ditutup</h2>
                <p>Ujian hanya dapat diakses antara pukul 07:00 - 15:00 WIB.</p>
            `;
        } else {
            /** * --- FILTER PERANGKAT KETAT ---
             * Menambahkan 'SEB' untuk mendukung Safe Exam Browser di iPhone
             */
            const allowedKeywords = ['Exambro', 'CBT', 'Kiosk', 'Version/4.0', 'wv', 'SEB'];
            let isValid = allowedKeywords.some(k => ua.toLowerCase().includes(k.toLowerCase()));
            
            // Logika Blokir PC & Browser Biasa
            // Jika mengandung 'Chrome' atau 'Safari' tapi bukan Webview/SEB, maka blokir.
            if (ua.includes('Windows') || ua.includes('Macintosh')) {
                isValid = false;
            }

            if (isValid && code) {
                try {
                    const targetUrl = atob(code);
                    window.location.replace(targetUrl);
                } catch (e) {
                    document.getElementById('app').innerHTML = `<h2>Error</h2><p>Kode link tidak valid.</p>`;
                }
            } else {
                document.getElementById('app').innerHTML = `
                    <h2>ASAJ 2025/2026</h2>
                    <strong>SMK Negeri 1 Kismantoro</strong>
                    <div class="alert">AKSES DITOLAK!</div>
                    <p>Gunakan aplikasi <b>Exambro Resmi</b> atau <b>Safe Exam Browser</b> untuk mengerjakan soal.</p>
                    
                    <button onclick="location.reload()" class="btn">COBA LAGI</button>
                    <button onclick="copyUA()" class="btn btn-copy">SALIN ID PERANGKAT</button>
                    
                    <div class="ua-box">
                        <span class="ua-title">ID PERANGKAT (USER-AGENT):</span>
                        <span id="uaText">${ua}</span>
                    </div>
                `;
            }
        }

        function copyUA() {
            const textToCopy = document.getElementById('uaText').innerText;
            navigator.clipboard.writeText(textToCopy).then(() => {
                alert('ID Perangkat berhasil disalin!');
            }).catch(err => {
                alert('Gagal menyalin.');
            });
        }
    </script>
</body>
</html>
